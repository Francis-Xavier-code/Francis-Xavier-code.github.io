baseURL: https://Francis-Xavier-code.github.io
locale: zh-cn
defaultContentLanguage: zh-cn
hasCJKLanguage: true
title: "Black Cat's Blog"
theme: PaperMod

outputs:
  home:
    - HTML
    - RSS
    - JSON


outputFormats:
  JSON:
    mediaType: application/json
    baseName: index
    isPlainText: true
  RSS:
    mediaType: application/rss+xml
    baseName: rss

pagination:
  pagerSize: 10

permalinks:
  post: /p/:slug/
  page: /:slug/

params:
  ShowCodeCopyButtons: true
  disableSpecial1stPost: true
  profileMode:
    enabled: true
    title: Black Cat
    subtitle: 生命不止，折腾不息
    imageUrl: /img/avatar.png
    imageTitle: "Black Cat"
    imageWidth: 120
    imageHeight: 120

  socialIcons:
    - name: github
      url: https://github.com/Francis-Xavier-code
    - name: email
      url: mailto:xynrin@163.com
    - name: bilibili
      url: https://space.bilibili.com/1198508132
    - name: rss
      url: /rss.xml

  mainSections:
    - post
  featuredImageField: image
  rssFullContent: true
  ShowRssButtonInSectionTermList: false
  favicon: img/favicon.png
  assets:
    favicon: img/favicon.png
  description: "Black Cat 的个人博客，记录技术折腾与日常思考。"

  DateFormat: "2006年01月02日"

  analytics:
    google:
      SiteVerificationTag: "2dTPklx6cOydPSINuCHxypLaCezdhnuyPBVY7rd189s"

  disableThemeToggle: false
  defaultTheme: auto

  cover:
    hiddenInList: true
    hiddenInSingle: true

markup:
  goldmark:
    renderer:
      unsafe: true
  highlight:
    noClasses: false
    codeFences: true
    guessSyntax: true
    lineNoStart: 1
    lineNos: true
    lineNumbersInTable: true
    tabWidth: 4

menu:
  main:
    - identifier: post
      name: 文章
      url: /post/
      weight: 10
    - identifier: about
      name: 关于
      url: /about/
      weight: 20
    - identifier: friends
      name: 友链
      url: /friends/
      weight: 25
    - identifier: search
      name: 搜索
      url: /search/
      weight: 30

