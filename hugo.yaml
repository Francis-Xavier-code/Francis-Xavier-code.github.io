baseURL: https://Francis-Xavier-code.github.io
locale: zh-cn
defaultContentLanguage: zh-cn
hasCJKLanguage: true
title: "Black Cat's Blog"
theme: PaperMod

outputs:
  home:
    - HTML
    - RSS
    - JSON


outputFormats:
  JSON:
    mediaType: application/json
    baseName: index
    isPlainText: true
  RSS:
    mediaType: application/rss+xml
    baseName: feed

pagination:
  pagerSize: 10

permalinks:
  post: /p/:slug/
  page: /:slug/

params:
  ShowCodeCopyButtons: true
  disableSpecial1stPost: true
  homeInfoParams:
    Title: "最近文章"
    Content: "记录技术折腾与日常思考。"
  mainSections:
    - post
  featuredImageField: image
  rssFullContent: true
  ShowRssButtonInSectionTermList: false
  favicon: img/favicon.png
  assets:
    favicon: img/favicon.png
  description: "Black Cat 的个人博客，记录技术折腾与日常思考。"

  DateFormat: "2006年01月02日"

  analytics:
    google:
      SiteVerificationTag: "2dTPklx6cOydPSINuCHxypLaCezdhnuyPBVY7rd189s"

  disableThemeToggle: false
  defaultTheme: auto

  cover:
    hiddenInList: true
    hiddenInSingle: true

markup:
  goldmark:
    renderer:
      unsafe: true
  highlight:
    noClasses: false
    codeFences: true
    guessSyntax: true
    lineNoStart: 1
    lineNos: true
    lineNumbersInTable: true
    tabWidth: 4

menu:
  main:
    - identifier: archives
      name: 归档
      url: /archives/
      weight: 10
    - identifier: about
      name: 关于
      url: /about/
      weight: 20
    - identifier: search
      name: 搜索
      url: /search/
      weight: 30

