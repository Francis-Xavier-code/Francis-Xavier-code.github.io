baseURL: https://xynrin.github.io
locale: zh-cn
defaultContentLanguage: zh-cn
hasCJKLanguage: true
title: XYNRIN-BLOG
theme: hugo-theme-stack

outputs:
  home:
    - HTML
    - RSS
    - JSON
  page:
    - HTML

outputFormats:
  JSON:
    mediaType: application/json
    baseName: index
    isPlainText: true

pagination:
  pagerSize: 6

permalinks:
  post: /p/:slug/
  page: /:slug/

params:
  mainSections:
    - post
  featuredImageField: image
  rssFullContent: true
  favicon: img/favicon.png

  sidebarBanner:
    image: img/my-linux-do.png

  since: "2026-05-19"

  hero:
    enabled: true
    title: 'XYNRIN<span class="hero-accent">·</span>BLOG'
    subtitle: '记录折腾，留下痕迹'
    typing:
      - "用代码丈量世界"
      - "用文字凝固时间"
      - "Stay curious, stay foolish"

  reward:
    enabled: true
    comment: "如果觉得有帮助，请我喝杯咖啡 ☕"
    image: img/zan-shang.png

  footer:
    since: 2026
    customText: '本站源码遵循 <a href="https://github.com/Xynrin/Xynrin.github.io/blob/main/LICENSE" target="_blank" rel="noopener">GPL-3.0</a> 协议开源'

  dateFormat:
    published: 2006-01-02
    lastUpdated: 2006-01-02 15:04 MST

  sidebar:
    emoji: "✨"
    subtitle: xynrin的个人博客
    avatar: img/avatar.png

  article:
    math: true
    toc: true
    readingTime: true
    license:
      enabled: true
      default: 知识共享署名-非商业性使用-相同方式共享 4.0 国际许可协议

  comments:
    enabled: true
    provider: waline
    waline:
      serverURL: https://pinglun-blog.vercel.app
      pageview: true
      emoji:
        - https://unpkg.com/@waline/emojis@1.1.0/weibo
      requiredMeta:
        - nick
      lang: zh-CN

  analytics:
    busuanzi:
      enabled: true

  widgets:
    homepage:
      - type: search
      - type: archives
        params:
          limit: 5
      - type: categories
        params:
          limit: 10
      - type: tag-cloud
        params:
          limit: 10
      - type: rss-qr
    page:
      - type: toc

  opengraph:
    twitter:
      site: ""
      card: summary_large_image

  defaultImage:
    opengraph:
      enabled: false
      local: false
      src: ""

  colorScheme:
    toggle: true
    default: auto

  imageProcessing:
    cover:
      enabled: true
    content:
      enabled: true

menu:
  main:
    - identifier: home
      name: 首页
      url: /
      weight: -100
      params:
        icon: home
  social:
    - identifier: github
      name: GitHub
      url: https://github.com/Xynrin
      params:
        icon: brand-github
    - identifier: linuxdo
      name: Linux.do
      url: https://linux.do/u/xynrin/
      params:
        icon: brand-linuxdo
    - identifier: email
      name: Email
      url: mailto:xynrin@163.com
      params:
        icon: mail

related:
  includeNewer: true
  threshold: 60
  toLower: false
  indices:
    - name: tags
      weight: 100
    - name: categories
      weight: 200

markup:
  goldmark:
    renderer:
      unsafe: true
  tableOfContents:
    endLevel: 4
    ordered: true
    startLevel: 2
  highlight:
    noClasses: false
    codeFences: true
    guessSyntax: true
    lineNoStart: 1
    lineNos: true
    lineNumbersInTable: true
    tabWidth: 4
