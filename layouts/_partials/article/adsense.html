{{/* ============ 文章内 Google AdSense 广告位 ============ */}}

{{ if and .Site.Params.adsense.enabled .Site.Params.adsense.articleSlot }}
<div class="article-adsense">
    <ins class="adsbygoogle"
         style="display:block; text-align:center;"
         data-ad-client="{{ .Site.Params.adsense.client }}"
         data-ad-slot="{{ .Site.Params.adsense.articleSlot }}"
         data-ad-format="auto"
         data-full-width-responsive="true"></ins>
    <script>
        (adsbygoogle = window.adsbygoogle || []).push({});
    </script>
</div>
{{ end }}
