{{- $cfg := .Site.Params.reward -}}
{{- $img := partial "helper/image" (dict "Image" $cfg.image "Resources" resources "Context" .) -}}
<section class="reward">
    <button class="reward-trigger" type="button" id="reward-trigger">
        <span class="reward-emoji">☕</span>
        <span>{{ default "请我喝杯咖啡" $cfg.comment }}</span>
    </button>
    <div class="reward-popup" id="reward-popup" hidden>
        {{- with $img -}}
        <img src="{{ .Permalink }}" alt="赞赏" />
        {{- end -}}
        <p class="reward-tip">扫码支持作者 ✨</p>
    </div>
</section>
<script>
(function(){
    const btn = document.getElementById('reward-trigger');
    const pop = document.getElementById('reward-popup');
    if (!btn || !pop) return;
    btn.addEventListener('click', () => {
        pop.hidden = !pop.hidden;
        btn.classList.toggle('active', !pop.hidden);
    });
})();
</script>
