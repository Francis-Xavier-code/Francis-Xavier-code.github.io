{{- $cfg := .Site.Params.comments.waline -}}
{{- if $cfg.serverURL -}}
<div id="waline" class="waline-container"></div>
<script type="module">
import { init } from 'https://unpkg.com/@waline/client@v3/dist/waline.js';
init({
    el: '#waline',
    serverURL: {{ $cfg.serverURL | jsonify | safeJS }},
    path: window.location.pathname,
    pageview: {{ $cfg.pageview | default true }},
    lang: {{ $cfg.lang | default "zh-CN" | jsonify | safeJS }},
    emoji: {{ $cfg.emoji | jsonify | safeJS }},
    requiredMeta: {{ $cfg.requiredMeta | jsonify | safeJS }},
    reaction: true,
    locale: {
        placeholder: '欢迎留言（支持 Markdown）'
    }
});
</script>
{{- else -}}
<div class="waline-placeholder">
    <p>💬 评论系统尚未配置</p>
    <p style="font-size:.85em;opacity:.7">在 <code>hugo.yaml</code> 的 <code>params.comments.waline.serverURL</code> 里填入你的 Waline 后端地址即可启用</p>
</div>
{{- end -}}
