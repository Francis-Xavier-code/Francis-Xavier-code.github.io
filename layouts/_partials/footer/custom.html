{{/* ============ 站点底部自定义注入 ============ */}}

{{/* 运行时间 */}}
{{ with .Site.Params.since }}
<script>
(function () {
    const since = new Date("{{ . }}T00:00:00").getTime();
    function pad(n){return n<10?'0'+n:n}
    function tick(){
        const now = Date.now();
        let diff = Math.max(0, now - since);
        const d = Math.floor(diff / 86400000); diff %= 86400000;
        const h = Math.floor(diff / 3600000);  diff %= 3600000;
        const m = Math.floor(diff / 60000);    diff %= 60000;
        const s = Math.floor(diff / 1000);
        const el = document.getElementById('site-uptime');
        if (el) el.textContent = `${d} 天 ${pad(h)}:${pad(m)}:${pad(s)}`;
    }
    document.addEventListener('DOMContentLoaded', () => { tick(); setInterval(tick, 1000); });
})();
</script>
{{ end }}

{{/* 阅读进度条 */}}
<div id="reading-progress"></div>
<script>
(function(){
    const bar = document.getElementById('reading-progress');
    if (!bar) return;
    function update(){
        const h = document.documentElement;
        const total = h.scrollHeight - h.clientHeight;
        const pct = total > 0 ? (h.scrollTop / total) * 100 : 0;
        bar.style.width = pct + '%';
    }
    window.addEventListener('scroll', update, { passive: true });
    window.addEventListener('resize', update);
    update();
})();
</script>

{{/* 回到顶部 */}}
<button id="back-to-top" aria-label="回到顶部" title="回到顶部">
    <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M5 15l7-7 7 7"/>
    </svg>
</button>
<script>
(function(){
    const btn = document.getElementById('back-to-top');
    if (!btn) return;
    function toggle(){ btn.classList.toggle('visible', window.scrollY > 400); }
    window.addEventListener('scroll', toggle, { passive: true });
    btn.addEventListener('click', () => window.scrollTo({ top: 0, behavior: 'smooth' }));
    toggle();
})();
</script>

{{/* TOC 当前段高亮 */}}
<script>
(function(){
    const toc = document.querySelector('#TableOfContents');
    if (!toc) return;
    const links = toc.querySelectorAll('a[href^="#"]');
    if (!links.length) return;
    const map = new Map();
    links.forEach(a => {
        const id = decodeURIComponent(a.getAttribute('href').slice(1));
        const el = document.getElementById(id);
        if (el) map.set(el, a);
    });
    const io = new IntersectionObserver(entries => {
        entries.forEach(en => {
            const a = map.get(en.target);
            if (!a) return;
            if (en.isIntersecting) {
                links.forEach(x => x.classList.remove('toc-active'));
                a.classList.add('toc-active');
            }
        });
    }, { rootMargin: '-30% 0px -65% 0px' });
    map.forEach((_, el) => io.observe(el));
})();
</script>

{{/* Mermaid 渲染 */}}
<script type="module">
import mermaid from 'https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.esm.min.mjs';
const isDark = () => document.documentElement.dataset.scheme === 'dark';
mermaid.initialize({ startOnLoad: false, theme: isDark() ? 'dark' : 'default', securityLevel: 'loose' });
document.querySelectorAll('pre > code.language-mermaid').forEach((block, i) => {
    const code = block.textContent;
    const wrap = document.createElement('div');
    wrap.className = 'mermaid';
    wrap.id = 'mermaid-' + i;
    wrap.textContent = code;
    block.parentElement.replaceWith(wrap);
});
mermaid.run({ querySelector: '.mermaid' });
</script>

{{/* KaTeX auto-render */}}
{{ if .Site.Params.article.math }}
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js"
    onload='renderMathInElement(document.body, {
        delimiters: [
            { left: "$$", right: "$$", display: true },
            { left: "$", right: "$", display: false },
            { left: "\\(", right: "\\)", display: false },
            { left: "\\[", right: "\\]", display: true }
        ],
        throwOnError: false
    });'></script>
{{ end }}

{{/* 快捷键：/ 或 Ctrl+K 聚焦搜索 */}}
<script>
document.addEventListener('keydown', (e) => {
    const focusable = document.querySelector('.search-form input, input[name="keyword"]');
    if (!focusable) return;
    const isTyping = ['INPUT','TEXTAREA'].includes(document.activeElement.tagName);
    if (e.key === '/' && !isTyping) { e.preventDefault(); focusable.focus(); }
    else if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k') { e.preventDefault(); focusable.focus(); }
});
</script>
