{{- $rssURL := printf "%sindex.xml" .Context.Site.BaseURL -}}
<section class="widget rss-qr-widget">
    <h2 class="widget-title section-title">RSS 订阅</h2>
    <div class="widget--rss-qr">
        <img src="https://api.qrserver.com/v1/create-qr-code/?size=160x160&data={{ $rssURL | urlquery }}" alt="RSS QR" loading="lazy" />
        <p>
            <a href="{{ $rssURL }}" target="_blank" rel="noopener">📡 订阅 RSS</a>
        </p>
    </div>
</section>
