{{ define "body-class" }}template-search{{ end }}

{{ define "head" }}
    {{- with .OutputFormats.Get "json" -}}
    <link rel="alternate" type="application/json" href="{{ .Permalink }}" title="search index">
    {{- end -}}
{{ end }}

{{ define "main" }}
<div class="fzf-search">
    <form action="{{ .RelPermalink }}" class="search-form" data-json="{{ (.OutputFormats.Get "json").RelPermalink }}" onsubmit="return false">
        <p>
            <label>
                <span class="search-form__label-text">{{ T "search.title" }}</span>
                <span class="search-form__hint">按 <kbd>/</kbd> 聚焦 · <kbd>↑</kbd><kbd>↓</kbd> 导航 · <kbd>Enter</kbd> 打开 · <kbd>Esc</kbd> 清空</span>
            </label>
            <input id="fzf-input" name="keyword" autocomplete="off" placeholder="{{ T `search.placeholder` }}" />
            <button title="{{ T `search.title` }}">{{ partial "helper/icon" "search" }}</button>
        </p>
    </form>

    <h3 class="search-result--title section-title" id="fzf-status"></h3>
    <div class="search-result--list" id="fzf-results"></div>
</div>

<script>
(function () {
    const $form = document.querySelector('.fzf-search .search-form');
    const $input = document.getElementById('fzf-input');
    const $list = document.getElementById('fzf-results');
    const $status = document.getElementById('fzf-status');
    if (!$form || !$input || !$list) return;

    const jsonURL = $form.dataset.json;
    let dataset = null;
    let activeIdx = -1;
    let lastQuery = '';

    function escapeHTML(s) {
        return s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    }

    /** 简易 fzf 评分：返回命中位置数组 + 评分；未命中返回 null */
    function fuzzyMatch(text, query) {
        if (!query) return { score: 0, indices: [] };
        const t = text.toLowerCase();
        const q = query.toLowerCase();
        let i = 0, j = 0, indices = [];
        let score = 0, prev = -2, streak = 0;
        while (i < t.length && j < q.length) {
            if (t[i] === q[j]) {
                indices.push(i);
                if (i === prev + 1) streak++; else streak = 1;
                score += 10 + streak * 4;
                if (i === 0 || /[\s\-_·,。.\/]/.test(t[i - 1])) score += 8; // 词边界加分
                prev = i;
                j++;
            }
            i++;
        }
        if (j < q.length) return null;
        // 越靠前评分越高
        score += Math.max(0, 40 - indices[0]);
        return { score, indices };
    }

    function highlight(text, indices) {
        if (!indices || !indices.length) return escapeHTML(text);
        let out = '', last = 0;
        for (const idx of indices) {
            out += escapeHTML(text.slice(last, idx));
            out += '<mark>' + escapeHTML(text[idx]) + '</mark>';
            last = idx + 1;
        }
        out += escapeHTML(text.slice(last));
        return out;
    }

    function searchAll(query) {
        if (!dataset) return [];
        const results = [];
        for (const item of dataset) {
            const titleM = fuzzyMatch(item.title || '', query);
            const contentM = fuzzyMatch(item.content || '', query);
            const tagsM = fuzzyMatch((item.tags || []).join(' '), query);
            if (!titleM && !contentM && !tagsM) continue;
            const score =
                (titleM ? titleM.score * 4 : 0) +
                (tagsM ? tagsM.score * 2 : 0) +
                (contentM ? contentM.score : 0);
            results.push({
                ...item,
                _score: score,
                _titleHL: titleM ? highlight(item.title, titleM.indices) : escapeHTML(item.title),
                _previewHL: contentM
                    ? makePreview(item.content, contentM.indices)
                    : escapeHTML((item.content || '').slice(0, 140))
            });
        }
        results.sort((a, b) => b._score - a._score);
        return results.slice(0, 30);
    }

    function makePreview(text, indices) {
        const first = indices[0];
        const start = Math.max(0, first - 30);
        const end = Math.min(text.length, first + 110);
        let snippet = text.slice(start, end);
        const adjust = indices.map(i => i - start).filter(i => i >= 0 && i < snippet.length);
        let out = '', last = 0;
        for (const idx of adjust) {
            out += escapeHTML(snippet.slice(last, idx));
            out += '<mark>' + escapeHTML(snippet[idx]) + '</mark>';
            last = idx + 1;
        }
        out += escapeHTML(snippet.slice(last));
        return (start > 0 ? '… ' : '') + out + (end < text.length ? ' …' : '');
    }

    function render(results, query) {
        if (!query) {
            $list.innerHTML = '';
            $status.textContent = '';
            return;
        }
        if (!results.length) {
            $list.innerHTML = '<div class="fzf-empty">没有找到 “' + escapeHTML(query) + '” 相关内容</div>';
            $status.textContent = '';
            return;
        }
        $status.textContent = `找到 ${results.length} 条结果`;
        $list.innerHTML = results.map((r, i) => `
            <article class="fzf-item${i === 0 ? ' active' : ''}" data-href="${r.permalink}">
                <a href="${r.permalink}">
                    <div class="article-details">
                        <h2 class="article-title">${r._titleHL}</h2>
                        <section class="article-preview">${r._previewHL}</section>
                        <div class="fzf-meta">
                            ${r.date ? `<span>📅 ${r.date}</span>` : ''}
                            ${(r.tags || []).slice(0, 3).map(t => `<span class="fzf-tag">#${escapeHTML(t)}</span>`).join('')}
                        </div>
                    </div>
                </a>
            </article>
        `).join('');
        activeIdx = 0;
    }

    function setActive(idx) {
        const items = $list.querySelectorAll('.fzf-item');
        if (!items.length) return;
        idx = (idx + items.length) % items.length;
        items.forEach((el, i) => el.classList.toggle('active', i === idx));
        items[idx].scrollIntoView({ block: 'nearest', behavior: 'smooth' });
        activeIdx = idx;
    }

    let debounceTimer;
    function onInput() {
        clearTimeout(debounceTimer);
        debounceTimer = setTimeout(() => {
            const q = $input.value.trim();
            if (q === lastQuery) return;
            lastQuery = q;
            const url = new URL(window.location);
            if (q) url.searchParams.set('keyword', q); else url.searchParams.delete('keyword');
            window.history.replaceState('', '', url.toString());
            render(searchAll(q), q);
        }, 80);
    }

    async function loadData() {
        $status.textContent = '正在加载索引…';
        try {
            const res = await fetch(jsonURL);
            dataset = await res.json();
            $status.textContent = `已加载 ${dataset.length} 篇文章`;
            // 处理初始 query
            const initial = new URLSearchParams(window.location.search).get('keyword');
            if (initial) { $input.value = initial; onInput(); }
            else $status.textContent = `输入关键词搜索 ${dataset.length} 篇文章`;
        } catch (e) {
            $status.textContent = '索引加载失败';
        }
    }

    $input.addEventListener('input', onInput);
    $input.addEventListener('compositionend', onInput);
    $input.addEventListener('keydown', (e) => {
        const items = $list.querySelectorAll('.fzf-item');
        if (e.key === 'ArrowDown') { e.preventDefault(); setActive(activeIdx + 1); }
        else if (e.key === 'ArrowUp') { e.preventDefault(); setActive(activeIdx - 1); }
        else if (e.key === 'Enter') {
            const target = items[activeIdx];
            if (target) { e.preventDefault(); window.location.href = target.dataset.href; }
        } else if (e.key === 'Escape') {
            $input.value = ''; lastQuery = ''; render([], '');
        }
    });

    loadData();
    $input.focus();
})();
</script>

{{ partialCached "footer/footer" . }}
{{ end }}
