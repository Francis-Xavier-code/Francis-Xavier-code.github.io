{{- if site.Params.comments.enabled -}}
{{- $giscus := site.Params.comments.giscus -}}
<div class="comments-container" style="margin-top: 4rem; width: 100%; border-top: 1px solid var(--border); padding-top: 2rem;">
    <div id="giscus-container"></div>
</div>

<script>
    (function() {
        const lightTheme = {{ $giscus.lightTheme | default "light" | jsonify }};
        const darkTheme = {{ $giscus.darkTheme | default "dark_dimmed" | jsonify }};

        function getGiscusTheme() {
            const theme = document.documentElement.dataset.theme || localStorage.getItem("pref-theme") || {{ site.Params.defaultTheme | default "dark" | jsonify }};
            return theme === "dark" ? darkTheme : lightTheme;
        }

        const script = document.createElement("script");
        script.src = "https://giscus.app/client.js";
        script.setAttribute("data-repo", {{ $giscus.repo | jsonify }});
        script.setAttribute("data-repo-id", {{ $giscus.repoID | jsonify }});
        script.setAttribute("data-category", {{ $giscus.category | jsonify }});
        script.setAttribute("data-category-id", {{ $giscus.categoryID | jsonify }});
        script.setAttribute("data-mapping", {{ $giscus.mapping | default "pathname" | jsonify }});
        script.setAttribute("data-strict", "0");
        script.setAttribute("data-reactions-enabled", {{ $giscus.reactionsEnabled | default "1" | jsonify }});
        script.setAttribute("data-emit-metadata", {{ $giscus.emitMetadata | default "0" | jsonify }});
        script.setAttribute("data-input-position", {{ $giscus.inputPosition | default "top" | jsonify }});
        script.setAttribute("data-theme", getGiscusTheme());
        script.setAttribute("data-lang", {{ $giscus.lang | default "zh-CN" | jsonify }});
        script.setAttribute("data-loading", {{ $giscus.loading | default "lazy" | jsonify }});
        script.setAttribute("crossorigin", "anonymous");
        script.async = true;

        const container = document.getElementById("giscus-container");
        if (container) {
            container.appendChild(script);
        }

        function updateGiscusTheme() {
            const iframe = document.querySelector('iframe.giscus-frame');
            if (iframe) {
                iframe.contentWindow.postMessage(
                    { giscus: { setConfig: { theme: getGiscusTheme() } } },
                    'https://giscus.app'
                );
            }
        }

        // Monitor theme changes via MutationObserver
        const observer = new MutationObserver((mutations) => {
            mutations.forEach((mutation) => {
                if (mutation.type === "attributes" && mutation.attributeName === "data-theme") {
                    updateGiscusTheme();
                }
            });
        });
        observer.observe(document.documentElement, { attributes: true, attributeFilter: ["data-theme"] });
    })();
</script>
{{- end -}}
