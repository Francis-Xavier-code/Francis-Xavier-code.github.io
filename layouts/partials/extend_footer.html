{{ if .Site.Params.analytics.busuanzi.enabled }}
<div class="site-stats" style="text-align: center; font-size: 14px; color: var(--secondary); margin-top: 10px;">
    {{ with .Site.Params.since }}
    <span class="stat-item" style="margin-right: 15px;">
        ⏱ 已运行 <span id="site-uptime">--</span>
    </span>
    {{ end }}
    <span class="stat-item" style="margin-right: 15px;">
        👁 总访问 <span id="busuanzi_value_site_pv">--</span> 次
    </span>
    <span class="stat-item">
        👤 访客 <span id="busuanzi_value_site_uv">--</span> 人
    </span>
</div>

<script async src="//busuanzi.ibruce.info/busuanzi/2.3/busuanzi.pure.mini.js"></script>

{{ with .Site.Params.since }}
<script>
(function () {
    const since = new Date("{{ . }}T00:00:00").getTime();
    function pad(n){return n<10?'0'+n:n}
    function tick(){
        const now = Date.now();
        let diff = Math.max(0, now - since);
        const d = Math.floor(diff / 86400000); diff %= 86400000;
        const h = Math.floor(diff / 3600000);  diff %= 3600000;
        const m = Math.floor(diff / 60000);    diff %= 60000;
        const s = Math.floor(diff / 1000);
        const el = document.getElementById('site-uptime');
        if (el) el.textContent = `${d} 天 ${pad(h)}:${pad(m)}:${pad(s)}`;
    }
    document.addEventListener('DOMContentLoaded', () => { tick(); setInterval(tick, 1000); });
})();
</script>
{{ end }}
{{ end }}
