{{/* 瞬间图片灯箱：列表页与单页共用。含滚轮缩放 / 双击 / 拖拽 / 触摸捏合 / 键盘导航。 */}}
<div id="memo-lightbox" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); z-index: 9999; justify-content: center; align-items: center; user-select: none;">
    <span id="lightbox-close" style="position: absolute; top: 20px; right: 20px; color: white; font-size: 30px; cursor: pointer; font-weight: bold; width: 40px; height: 40px; display: flex; align-items: center; justify-content: center; background: rgba(255,255,255,0.1); border-radius: 50%;">&times;</span>
    <span id="lightbox-prev" style="position: absolute; left: 20px; color: white; font-size: 40px; cursor: pointer; background: rgba(255,255,255,0.1); width: 50px; height: 50px; display: flex; align-items: center; justify-content: center; border-radius: 50%; font-family: monospace;">&lt;</span>
    <img id="lightbox-img" src="" alt="preview" style="max-width: 90%; max-height: 90%; object-fit: contain; box-shadow: 0 4px 20px rgba(0,0,0,0.5); border-radius: 4px; transition: transform 0.2s ease;">
    <span id="lightbox-next" style="position: absolute; right: 20px; color: white; font-size: 40px; cursor: pointer; background: rgba(255,255,255,0.1); width: 50px; height: 50px; display: flex; align-items: center; justify-content: center; border-radius: 50%; font-family: monospace;">&gt;</span>
    <div id="lightbox-index" style="position: absolute; bottom: 20px; color: white; font-size: 14px; background: rgba(0,0,0,0.5); padding: 4px 12px; border-radius: 20px;">1 / 1</div>
</div>

<script>
document.addEventListener('DOMContentLoaded', () => {
    const lightbox = document.getElementById('memo-lightbox');
    if (!lightbox) return;
    const lightboxImg = document.getElementById('lightbox-img');
    const lightboxIndex = document.getElementById('lightbox-index');
    const prevBtn = document.getElementById('lightbox-prev');
    const nextBtn = document.getElementById('lightbox-next');
    const closeBtn = document.getElementById('lightbox-close');

    let currentGallery = [];
    let currentIndex = 0;

    let scale = 1, translateX = 0, translateY = 0;
    let isDragging = false, startX = 0, startY = 0;

    function resetZoom() {
        scale = 1; translateX = 0; translateY = 0;
        updateTransform(true);
        lightboxImg.style.cursor = 'zoom-in';
    }

    function updateTransform(smooth = false) {
        lightboxImg.style.transition = smooth ? 'transform 0.2s ease-out' : 'none';
        lightboxImg.style.transform = `translate(${translateX}px, ${translateY}px) scale(${scale})`;
    }

    document.querySelectorAll('.memo-gallery a').forEach(link => {
        link.addEventListener('click', (e) => {
            e.preventDefault();
            const galleryContainer = link.closest('.memo-gallery');
            currentGallery = Array.from(galleryContainer.querySelectorAll('a')).map(a => a.href);
            currentIndex = currentGallery.indexOf(link.href);
            openLightbox();
        });
    });

    function openLightbox() { lightbox.style.display = 'flex'; updateImage(); }
    function closeLightbox() { lightbox.style.display = 'none'; resetZoom(); }

    function updateImage() {
        resetZoom();
        lightboxImg.src = currentGallery[currentIndex];
        lightboxIndex.innerText = `${currentIndex + 1} / ${currentGallery.length}`;
        const multi = currentGallery.length > 1;
        prevBtn.style.display = multi ? 'flex' : 'none';
        nextBtn.style.display = multi ? 'flex' : 'none';
    }

    function showPrev() { currentIndex = (currentIndex - 1 + currentGallery.length) % currentGallery.length; updateImage(); }
    function showNext() { currentIndex = (currentIndex + 1) % currentGallery.length; updateImage(); }

    prevBtn.addEventListener('click', (e) => { e.stopPropagation(); showPrev(); });
    nextBtn.addEventListener('click', (e) => { e.stopPropagation(); showNext(); });
    closeBtn.addEventListener('click', closeLightbox);
    lightbox.addEventListener('click', closeLightbox);
    lightboxImg.addEventListener('click', (e) => e.stopPropagation());

    lightbox.addEventListener('wheel', (e) => {
        e.preventDefault();
        const rect = lightboxImg.getBoundingClientRect();
        const mouseX = e.clientX - rect.left - rect.width / 2;
        const mouseY = e.clientY - rect.top - rect.height / 2;
        const zoomFactor = 0.15;
        const oldScale = scale;
        if (e.deltaY < 0) scale = Math.min(scale + zoomFactor * scale, 10);
        else scale = Math.max(scale - zoomFactor * scale, 1);
        if (scale === 1) { translateX = 0; translateY = 0; }
        else { translateX -= mouseX * (scale / oldScale - 1); translateY -= mouseY * (scale / oldScale - 1); }
        updateTransform(true);
        lightboxImg.style.cursor = scale > 1 ? 'grab' : 'zoom-in';
    }, { passive: false });

    lightboxImg.addEventListener('dblclick', (e) => {
        e.stopPropagation();
        if (scale > 1) { resetZoom(); return; }
        scale = 3;
        const rect = lightboxImg.getBoundingClientRect();
        const mouseX = e.clientX - rect.left - rect.width / 2;
        const mouseY = e.clientY - rect.top - rect.height / 2;
        translateX = -mouseX * 2; translateY = -mouseY * 2;
        updateTransform(true);
        lightboxImg.style.cursor = 'grab';
    });

    lightboxImg.addEventListener('mousedown', (e) => {
        e.preventDefault();
        if (scale <= 1) return;
        isDragging = true;
        startX = e.clientX - translateX; startY = e.clientY - translateY;
        lightboxImg.style.cursor = 'grabbing';
    });
    window.addEventListener('mousemove', (e) => {
        if (!isDragging) return;
        translateX = e.clientX - startX; translateY = e.clientY - startY;
        updateTransform(false);
    });
    window.addEventListener('mouseup', () => {
        if (isDragging) { isDragging = false; lightboxImg.style.cursor = scale > 1 ? 'grab' : 'zoom-in'; }
    });

    let initialTouchDist = 0, initialTouchScale = 1, touchStartX = 0, touchStartY = 0;
    lightboxImg.addEventListener('touchstart', (e) => {
        if (e.touches.length === 1 && scale > 1) {
            isDragging = true;
            touchStartX = e.touches[0].clientX - translateX;
            touchStartY = e.touches[0].clientY - translateY;
        } else if (e.touches.length === 2) {
            isDragging = false;
            initialTouchDist = getTouchDist(e);
            initialTouchScale = scale;
        }
    });
    lightboxImg.addEventListener('touchmove', (e) => {
        if (e.touches.length === 1 && isDragging) {
            translateX = e.touches[0].clientX - touchStartX;
            translateY = e.touches[0].clientY - touchStartY;
            updateTransform(false);
        } else if (e.touches.length === 2) {
            const dist = getTouchDist(e);
            if (dist > 0 && initialTouchDist > 0) {
                scale = Math.max(1, Math.min(initialTouchScale * (dist / initialTouchDist), 10));
                if (scale === 1) { translateX = 0; translateY = 0; }
                updateTransform(true);
            }
        }
    });
    lightboxImg.addEventListener('touchend', (e) => {
        isDragging = false;
        if (e.touches.length === 1) {
            isDragging = true;
            touchStartX = e.touches[0].clientX - translateX;
            touchStartY = e.touches[0].clientY - translateY;
        }
    });
    function getTouchDist(e) {
        return Math.hypot(
            e.touches[0].clientX - e.touches[1].clientX,
            e.touches[0].clientY - e.touches[1].clientY
        );
    }

    document.addEventListener('keydown', (e) => {
        if (lightbox.style.display === 'flex') {
            if (e.key === 'Escape') closeLightbox();
            if (e.key === 'ArrowLeft' && currentGallery.length > 1) showPrev();
            if (e.key === 'ArrowRight' && currentGallery.length > 1) showNext();
        }
    });
});
</script>
