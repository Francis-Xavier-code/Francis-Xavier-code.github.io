<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Xynrin's Blog - 本地管理后台</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <div class="main-container" style="margin: 0 auto; max-width: 1040px; min-height: 100vh;">
        <header class="header">
            <h2>文章管理</h2>
            <div class="status-indicator"><span class="status-dot"></span> 本地服务已连接</div>
        </header>

        <main class="content-body">
            <section class="page active">
                <div class="panel-header">
                    <h3>全部文章</h3>
                    <button class="btn" data-action="open-new-post">+ 新增文章</button>
                </div>
                <div id="posts-list" class="item-list"></div>
            </section>

            <section class="page active" style="margin-top: 2rem;">
                <div class="panel-header"><h3>发布站点</h3></div>
                <div class="card">
                    <p style="margin-bottom: 1.25rem; color: var(--text-muted); font-size: 14px;">
                        推送当前修改到 GitHub，GitHub Actions 会自动部署网站。
                    </p>
                    <button class="btn" id="deploy-btn">🚀 推送并部署</button>
                </div>
                <div id="console" class="console">准备就绪。</div>
            </section>
        </main>
    </div>

    <div id="new-post-modal" class="modal">
        <div class="modal-content">
            <h3 style="margin-bottom: 1.25rem;">创建新文章</h3>
            <form id="new-post-form">
                <div class="form-group"><label>文章标题</label><input type="text" id="post-title-input" class="form-control" placeholder="输入文章标题..." required></div>
                <div class="form-group"><label>文件名标识（Slug）</label><input type="text" id="post-slug-input" class="form-control" placeholder="例如: my-new-post" required></div>
                <div class="form-group"><label>描述</label><input type="text" id="post-desc-input" class="form-control" placeholder="一句话摘要..."></div>
                <div class="form-group"><label>分类</label><input type="text" id="post-categories-input" class="form-control" placeholder="多个分类用逗号分隔"></div>
                <div class="form-group"><label>标签</label><input type="text" id="post-tags-input" class="form-control" placeholder="多个标签用逗号分隔"></div>
                <div class="actions" style="justify-content: flex-end; margin-top: 1.5rem;">
                    <button type="button" class="btn btn-secondary" data-action="close-new-post">取消</button>
                    <button type="submit" class="btn">创建文章</button>
                </div>
            </form>
        </div>
    </div>

    <div id="toast" class="toast">操作成功！</div>
    <script src="/js/common.js"></script>
    <script src="/js/posts.js"></script>
    <script src="/js/deploy.js"></script>
    <script src="/js/main.js"></script>
</body>
</html>
